name: Creator Cabins
description: 'Creator Cabins (operating as Cabin, at cabin.city) is a crypto-web3 community project that
  built globally distributed, coliving neighborhoods uniting members through shared culture, economy,
  and token-based governance via the Cabin DAO. It began in 2020 with a 28-acre Texas Hill Country property
  known as Neighborhood Zero and grew into a multi-property network for remote workers before members voted
  to wind down the formal DAO structure in 2025; individual neighborhoods continue operating independently,
  and a related Neighborhood Village Project now serves over 100 communities globally. Surfaced as a portfolio
  company of Multicoin Capital and added to the API Evangelist network as a lead. No public developer API,
  documentation, or SDKs were found during enrichment.'
